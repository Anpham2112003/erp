[workspace]
members = ["api", "entity", "migration"]
resolver = "3"

[workspace.dependencies]
sea-orm = { version = "2.0.0", features = [
    "sqlx-postgres",
    "runtime-tokio-rustls",
    "macros",
] }

sea-orm-migration = { version = "2.0.0", features = [
    "runtime-tokio-rustls",
    "sqlx-postgres",
] }

tokio = { version = "1", features = [
    "macros",
    "rt",
    "rt-multi-thread",
] }